<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff1f3">
  <meta name="description" content="Привет, как дела? Выбери ответ.">
  <title>Привет, как дела?</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23ffe2e9'/%3E%3Cpath d='M16 25C-3 13 10 3 16 11C22 3 35 13 16 25' fill='%23b64067'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme:light; --ink:#55333f; --pink:#b64067; --soft:#fff1f3; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif; color:var(--ink); background:var(--soft); }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 18% 15%,#ffe1e980,transparent 48%),radial-gradient(ellipse at 90% 88%,#ffcbd650,transparent 42%); }
    button { font:inherit; -webkit-tap-highlight-color:transparent; }
    button:focus-visible { outline:3px solid var(--ink); outline-offset:6px; }
    main { min-height:100svh; display:grid; place-items:center; padding:24px 18px; overflow:hidden; position:relative; }
    .note { width:min(100%,680px); text-align:center; position:relative; }
    .cat-stage { position:relative; width:240px; height:220px; margin:0 auto 13px; display:grid; place-items:center; }
    .cat-stage::before { content:""; width:207px; height:207px; border-radius:50%; position:absolute; background:#ffe1e8; border:1px solid #f6cbd6; }
    .cat-motion { width:220px; height:220px; position:relative; z-index:1; will-change:transform; }
    .cat { display:block; width:100%; height:100%; object-fit:contain; animation:breathe 3s ease-in-out infinite; user-select:none; -webkit-user-drag:none; }
    h1 { margin:0; font-size:clamp(2.35rem,7vw,3.5rem); line-height:1.12; letter-spacing:-.04em; font-weight:800; }
    .subtitle { min-height:28px; margin:15px 0 0; line-height:1.5; color:#80626d; font-size:16px; }
    .arena { position:relative; width:100%; height:196px; margin:14px auto 0; }
    .answer { border:0; border-radius:18px; cursor:pointer; position:absolute; top:50%; transform:translate(-50%,-50%); min-height:56px; padding:16px 24px; font-size:18px; font-weight:700; white-space:nowrap; touch-action:manipulation; user-select:none; }
    .good { left:30%; color:white; background:var(--pink); box-shadow:0 7px 0 #8b2c4d,0 13px 22px #b640671c; transition:transform .32s cubic-bezier(.2,1.4,.4,1),background .2s; z-index:2; }
    .good:hover { background:#a73158; }
    .good:active { box-shadow:0 3px 0 #8b2c4d; }
    .bad { left:73%; color:#725963; background:#fffdfd; border:1px solid #e8ccd5; box-shadow:0 5px 0 #ebd8de; transition:transform .18s ease; z-index:3; }
    .bad::before { content:""; position:absolute; inset:-8px; border-radius:24px; }
    .attempts { display:flex; justify-content:center; gap:8px; min-height:9px; margin:0 0 14px; }
    .attempts span { width:7px; height:7px; border-radius:50%; background:#e8c4cf; transition:background .2s,transform .2s; }
    .attempts span.filled { background:var(--pink); transform:scale(1.15); }
    .footnote { margin:0; color:#8a6a77; font-size:14px; line-height:1.5; }
    .result { margin:25px auto 23px; max-width:510px; padding:25px 22px; border:1px solid #ecc5d1; border-radius:24px; background:#fffafbcc; box-shadow:0 8px 30px #8b2c4d08; }
    .drawer-message { margin:0; font-size:clamp(1.25rem,5vw,1.65rem); line-height:1.45; font-weight:700; }
    .replay { background:transparent; color:#85626f; border:0; border-bottom:1px solid #caa4b2; padding:9px 4px; font-size:14px; cursor:pointer; }
    [hidden] { display:none!important; }
    .is-done h1 { font-size:clamp(2rem,6.5vw,3rem); }
    .is-done .cat-stage { margin-bottom:20px; }
    @keyframes breathe { 0%,100% { transform:translateY(0) rotate(-1deg); } 50% { transform:translateY(-7px) rotate(1deg); } }
    @media (max-width:480px) {
      main { padding:22px 14px; }
      .cat-stage { width:205px; height:192px; margin-bottom:13px; }
      .cat-stage::before { width:180px; height:180px; }
      .cat-motion { width:195px; height:195px; }
      .arena { height:216px; margin-top:7px; }
      .answer { font-size:16px; padding:15px 19px; border-radius:16px; min-height:54px; }
      .good { left:30%; }
      .bad { left:77%; }
      .subtitle { font-size:15px; margin-top:13px; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation:none!important; transition:none!important; }
    }
  </style>
</head>

      function animateCat(type) {
        if (catAnimation) catAnimation.cancel();
        if (reducedMotion.matches || !catMotion.animate) return;
        const frames = type === 'flip'
          ? [{transform:'translateY(0) rotate(0deg)'},{transform:'translateY(-46px) rotate(160deg)',offset:.45},{transform:'translateY(-32px) rotate(270deg)',offset:.75},{transform:'translateY(0) rotate(360deg)'}]
          : [{transform:'translateY(0) rotate(0deg)'},{transform:'translate(-14px,-13px) rotate(-14deg)'},{transform:'translate(14px,-5px) rotate(14deg)'},{transform:'translate(-12px,-16px) rotate(-12deg)'},{transform:'translate(10px,-7px) rotate(12deg)'},{transform:'translateY(0) rotate(0deg)'}];
        catAnimation = catMotion.animate(frames,{duration:type === 'flip' ? 740 : 850,easing:'ease-in-out',iterations:1});
      }

      // Новая позиция всегда внутри площадки, вдали от курсора и «Хорошо».
      function moveBad(pointer) {
        const box = arena.getBoundingClientRect();
        const old = bad.getBoundingClientRect();
        const currentYes = good.getBoundingClientRect();
        const yesScale = 1+escapes*.12;
        const yesCenterX = (currentYes.left+currentYes.right)/2;
        const yesCenterY = (currentYes.top+currentYes.bottom)/2;
        const yes = {left:yesCenterX-good.offsetWidth*yesScale/2,right:yesCenterX+good.offsetWidth*yesScale/2,top:yesCenterY-good.offsetHeight*yesScale/2,bottom:yesCenterY+good.offsetHeight*yesScale/2};
        const size = 1 - escapes * .09;
        const width = bad.offsetWidth * size;
        const height = bad.offsetHeight * size;
        const margin = 15;
        const minX = width/2 + margin;
        const maxX = box.width-width/2-margin;
        const minY = height/2+margin;
        const maxY = box.height-height/2-margin;
        let best = null;
        let bestScore = -Infinity;
        // Перебираем безопасные позиции; выбираем наиболее удалённую.
        for (let row = 0; row < 7; row++) {
          for (let col = 0; col < 9; col++) {
            const x = minX+(maxX-minX)*col/8;
            const y = minY+(maxY-minY)*row/6;
            const rect = {left:box.left+x-width/2,right:box.left+x+width/2,top:box.top+y-height/2,bottom:box.top+y+height/2};
            const overlap = rect.left < yes.right+20 && rect.right > yes.left-20 && rect.top < yes.bottom+20 && rect.bottom > yes.top-20;
            if (overlap || (pointer && inside(pointer.x,pointer.y,rect,24))) continue;
            const oldDistance = Math.hypot(box.left+x-(old.left+old.width/2),box.top+y-(old.top+old.height/2));
            const pointerDistance = pointer ? Math.hypot(box.left+x-pointer.x,box.top+y-pointer.y) : 0;
            const score = oldDistance+pointerDistance*.45+Math.random()*20;
            if (score > bestScore) { bestScore = score; best = {x,y}; }
          }
        }
        if (!best) best = {x:maxX,y:maxY};
        // Позиция меняется сразу: пролёт над курсором не считается новой попыткой.
        bad.style.left = best.x+'px';
        bad.style.top = best.y+'px';
        bad.style.transform = 'translate(-50%,-50%) scale('+size+')';
      }

      function finish(selectedMood) {
        if (finished) return getState();
        finished = true;
        mood = selectedMood;
        note.classList.add('is-done');
        heading.textContent = selectedMood === 'good' ? 'Отлично!' : 'Ладно, сдаюсь.';
        subtitle.textContent = selectedMood === 'good' ? 'Тогда у меня для тебя сюрприз.' : '';
        arena.hidden = true;
        attempts.hidden = true;
        footnote.hidden = true;
        result.hidden = false;
        replay.hidden = false;
        animateCat(selectedMood === 'good' ? 'dance' : 'flip');
        return getState();
      }

      function evade(pointer = null) {
        if (finished) return getState();
        if (escapes >= MAX_ESCAPES) return finish('bad');
        escapes++;
        armed = false;
        if (pointer) lastEscape = pointer;
        subtitle.textContent = messages[escapes-1];
        good.style.transform = 'translate(-50%,-50%) scale('+(1+escapes*.12)+')';
        attempts.children[escapes-1].classList.add('filled');
        moveBad(pointer);
        animateCat(escapes%2 ? 'flip' : 'dance');
        return getState();
      }

      function getState() {
        return {escapes,maxEscapes:MAX_ESCAPES,finished,mood,message:finished ? 'Открой нижний ящик слева от стола.' : subtitle.textContent};
      }

      bad.addEventListener('pointerenter', event => {
        // На телефоне кнопка убегает от нажатия, на компьютере — от наведения.
        if (event.pointerType !== 'touch' && armed) evade({x:event.clientX,y:event.clientY});
      });
      document.addEventListener('pointermove', event => {
        if (finished || event.pointerType === 'touch') return;
        if (!inside(event.clientX,event.clientY,bad.getBoundingClientRect(),10) && Math.hypot(event.clientX-lastEscape.x,event.clientY-lastEscape.y)>14) armed = true;
        if (armed && inside(event.clientX,event.clientY,bad.getBoundingClientRect())) evade({x:event.clientX,y:event.clientY});
      });
      // Tab + Enter тоже работают: «Плохо» считает попытку, «Хорошо» открывает подсказку.
      bad.addEventListener('click', event => { event.preventDefault(); evade(event.detail ? {x:event.clientX,y:event.clientY} : null); });
      good.addEventListener('click', () => finish('good'));
      replay.addEventListener('click', () => {
        escapes = 0; finished = false; mood = null; armed = true;
        lastEscape = {x:-10000,y:-10000};
        if (catAnimation) catAnimation.cancel();
        note.classList.remove('is-done');
        heading.innerHTML = 'Привет,<br>как дела?';
        subtitle.textContent = '';
        good.style.transform = '';
        bad.style.left = ''; bad.style.top = ''; bad.style.transform = '';
        Array.from(attempts.children).forEach(dot => dot.classList.remove('filled'));
        arena.hidden = false; attempts.hidden = false; footnote.hidden = false;
        result.hidden = true; replay.hidden = true;
        good.focus({preventScroll:true});
      });
      window.addEventListener('resize', () => { if (escapes && !finished) moveBad(null); });

      // Если браузер поддерживает WebMCP, действия используют ту же логику, что и кнопки.
      if (document.modelContext?.registerTool) {
        const lifecycle = new AbortController();
        const tools = [
          {name:'read_cat_greeting',description:'Прочитать состояние вопроса.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:() => getState()},
          {name:'choose_cat_mood',description:'Выбрать «Хорошо» или сделать одну попытку выбрать «Плохо». После пяти побегов следующая попытка открывает подсказку.',inputSchema:{type:'object',properties:{mood:{type:'string',enum:['good','bad']}},required:['mood'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input => {if (!input || !['good','bad'].includes(input.mood) || Object.keys(input).some(key => key !== 'mood')) throw new Error('Укажите настроение good или bad.'); return input.mood === 'good' ? finish('good') : evade();}}
        ];
        for (const tool of tools) {
          try { Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(() => {}); } catch (_) { /* Обычные кнопки продолжают работать. */ }
        }
        window.addEventListener('pagehide', () => lifecycle.abort(),{once:true});
      }
    })();
  </script>
</body>
</html>
